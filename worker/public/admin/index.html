<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Адмінка · Каталог · Лілейка</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/brand.css">
  <link rel="stylesheet" href="admin.css">
  <script src="/theme.js"></script>
</head>
<body>
  <header class="top">
    <a class="lockup" href="/" aria-label="Лілейка, каталог">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(45 50 50)"><path d="M50 44 C54 33 62 28 71 33 C79 38 80 48 73 53 C68 56 62 55 60 51"/><path d="M50 44 C46 33 38 28 29 33 C21 38 20 48 27 53 C32 56 38 55 40 51"/><path d="M33 60 H67"/><path d="M50 88 C46 80 46 71 50 65 C54 71 54 80 50 88 Z"/><path class="mark-center" d="M50 7 C45 24 45 43 50 57 C55 43 55 24 50 7 Z"/></g></svg><span class="wordmark">Лілейка</span><span class="sub">адмінка</span>
    </a>
    <nav id="tabs">
      <button data-tab="badge" class="active">Вмілості</button>
      <button data-tab="probe">Проби</button>
      <button data-tab="edition">Редакції проб</button>
      <button data-tab="degree">Ступені</button>
      <button data-tab="award">Відзначення</button>
      <button data-tab="submissions">Подання</button>
      <button data-tab="editors" data-owner>Редактори</button>
      <button data-tab="audit">Журнал</button>
    </nav>
    <div class="who">
      <label>Край для перегляду
        <select id="preview-krai"><option value="">усі (без доповнень)</option></select>
      </label>
      <span id="me"></span>
      <button class="btn btn-text" data-theme-toggle type="button">Темна тема</button>
    </div>
  </header>

  <main id="catalog-view">
    <aside class="list">
      <div class="list-tools">
        <input id="search" type="search" placeholder="Пошук за назвою або id">
        <div class="row">
          <select id="filter-krai"><option value="">усі краї</option></select>
          <select id="filter-status">
            <option value="">усі статуси</option>
            <option value="approved">затверджені</option>
            <option value="trial">апробаційні</option>
            <option value="retired">виведені</option>
          </select>
        </div>
        <div class="row">
          <button id="new-item" class="secondary">+ Новий</button>
          <label class="button secondary">Завантажити zip<input id="zip" type="file" accept=".zip" hidden></label>
        </div>
      </div>
      <ul id="items"></ul>
      <div id="count" class="muted"></div>
    </aside>
    <section id="detail" class="detail">
      <p class="muted empty">Оберіть запис зліва, створіть новий або завантажте zip з <code>catalog.json</code> і текою <code>images/</code>.</p>
    </section>
  </main>

  <main id="submissions-view" hidden></main>
  <main id="editors-view" hidden></main>
  <main id="audit-view" hidden></main>

  <dialog id="dialog"><div id="dialog-body"></div></dialog>
  <script type="module" src="admin.js"></script>
</body>
</html>
